name: CI

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  pr-checks:
    name: Affected Checks (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fetch secrets via Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: 'oidc'
          identity-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          project-slug: e65ac486-ecf3-452c-ac44-ae7d978298e8
          env-slug: dev
        continue-on-error: true

      - name: Derive SHAs for Nx Affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Run Affected Quality Gates
        run: |
          echo "Running affected verification for base: ${NX_BASE} and head: ${NX_HEAD}"
          npx nx affected -t lint,typecheck,test,build --base=${NX_BASE} --head=${NX_HEAD} --parallel=3
